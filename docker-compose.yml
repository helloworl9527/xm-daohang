name: collection-system

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  APP_TIMEZONE: ${APP_TIMEZONE:?APP_TIMEZONE is required}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
  IP_HASH_KEY: ${IP_HASH_KEY:?IP_HASH_KEY is required}
  LOGIN_IP_HASH_KEY: ${LOGIN_IP_HASH_KEY:?LOGIN_IP_HASH_KEY is required}
  TG_ID_HASH_KEY: ${TG_ID_HASH_KEY:?TG_ID_HASH_KEY is required}
  PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?PROXY_SHARED_SECRET is required}
  GITHUB_PUBLIC_API_TOKEN: ${GITHUB_PUBLIC_API_TOKEN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: "3000"
    command: ["sh", "-c", "node --experimental-strip-types scripts/migrate.ts && exec node server.js"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend, egress]

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-environment
      WORKER_MODE: "1"
      WORKER_ID: ${WORKER_ID:?WORKER_ID is required}
      PORT: "3001"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "scripts/check-worker-health.ts"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    stop_grace_period: 45s
    networks: [backend, egress]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?PROXY_SHARED_SECRET is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [edge, backend]

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
  egress:
